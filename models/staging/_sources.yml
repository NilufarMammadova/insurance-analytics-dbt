version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: policies
        description: "Raw insurance policy records."

        config:
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
              
        columns:
          - name: policy_id
            data_tests:
              - not_null
              - unique
          - name: premium_amount
            data_tests:
              - not_null:
                  config:
                    severity: warn

      - name: customers
        description: "Raw insurance customer records."
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null

      - name: payments
        description: "Raw insurance payment records."
        columns:
          - name: payment_id
            data_tests:
              - unique
              - not_null