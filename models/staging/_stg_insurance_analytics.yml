version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_policies
    columns:
      - name: policy_id
        data_tests:
          - unique
          - not_null

      - name: policy_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - EXPIRED
                  - CANCELLED

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null